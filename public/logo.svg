<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PermitDrills logo">
  <!-- The Drill Diamond: a US warning-sign plate (amber diamond, navy edge)
       carrying a bold check — the sign says "warning", the check says "nailed it". -->
  <polygon points="32,2.5 61.5,32 32,61.5 2.5,32" fill="#FFB800" stroke="#0F2040" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M19.5 33.2 L28.2 42 L45 23.5" fill="none" stroke="#0F2040" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- road-centreline dashes cut into the check's rising arm -->
  <path d="M35.5 32.6 L38.6 29.2" fill="none" stroke="#FFB800" stroke-width="2.2" stroke-linecap="round"/>
</svg>
